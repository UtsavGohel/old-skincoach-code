<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes drawRing {
            from { stroke-dashoffset: 600; }
            to { stroke-dashoffset: 120; } /* Adjust based on final score 84% */
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes checkPop {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .animate-draw-ring {
            stroke-dasharray: 600;
            stroke-dashoffset: 600;
            animation: drawRing 1.5s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        .animate-fade-in {
            animation: fadeInScale 1s ease-out forwards;
        }

        .animate-slide-up {
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 1s;
        }

        .animate-check {
            opacity: 0;
            animation: checkPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 1.2s;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(56, 100, 88, 0.04);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center overflow-hidden">
<!-- WebGL Background -->

<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-[1200px] px-container-mobile md:px-container-desktop flex flex-col items-center justify-center min-h-screen">
<!-- Header Text -->
<header class="text-center mb-section-gap animate-fade-in">
<h1 class="font-display-lg text-headline-lg-mobile md:text-display-lg text-primary tracking-tight mb-2">Analysis Complete</h1>
<p class="font-body-lg text-on-surface-variant opacity-80">Your skin report is ready.</p>
</header>
<!-- Score Central Visualization -->
<div class="relative flex flex-col items-center justify-center animate-fade-in" style="animation-delay: 0.2s">
<!-- Checkmark Indicator -->
<div class="absolute -top-12 animate-check">
<div class="bg-primary text-on-primary rounded-full p-2 shadow-lg">
<span class="material-symbols-outlined text-[32px]">check</span>
</div>
</div>
<!-- Animated Ring & Score -->
<div class="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center">
<!-- SVG Ring -->
<svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 200 200">
<!-- Background Track -->
<circle class="text-secondary-container" cx="100" cy="100" fill="none" r="90" stroke="currentColor" stroke-width="8"></circle>
<!-- Active Path (84/100 = 565 units roughly) -->
<circle class="text-primary animate-draw-ring" cx="100" cy="100" fill="none" r="90" stroke="currentColor" stroke-linecap="round" stroke-width="10"></circle>
</svg>
<!-- Inner Content -->
<div class="glass-panel w-[85%] h-[85%] rounded-full flex flex-col items-center justify-center">
<div class="flex items-baseline">
<span class="font-display-lg text-6xl md:text-8xl text-primary tracking-tighter" id="score-counter">0</span>
</div>
<span class="font-label-md text-on-surface-variant uppercase tracking-widest mt-1">Today's Skin Score</span>
</div>
</div>
<!-- Growth Pill -->
<div class="mt-8 animate-slide-up">
<div class="bg-secondary-container text-on-secondary-container px-4 py-2 rounded-full flex items-center gap-2 font-label-md">
<span class="material-symbols-outlined text-[18px]">arrow_drop_up</span>
<span>+3 since yesterday</span>
</div>
</div>
</div>
<!-- Footer Encouragement -->
<footer class="mt-section-gap animate-fade-in text-center" style="animation-delay: 1.5s">
<div class="inline-flex items-center gap-2 px-6 py-3 bg-surface-container-low rounded-full border border-outline-variant/30">
<span class="text-primary">✨</span>
<p class="font-body-md text-on-surface">Your consistency is paying off.</p>
</div>
</footer>
</main>
<!-- Micro-interactions & Score Counter JS -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const counterElement = document.getElementById('score-counter');
            const targetValue = 84;
            const duration = 1500; // 1.5 seconds
            const startTime = performance.now();

            function updateCounter(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease out cubic function for a premium feel
                const easeOutCubic = 1 - Math.pow(1 - progress, 3);
                const currentValue = Math.floor(easeOutCubic * targetValue);
                
                counterElement.textContent = currentValue;

                if (progress < 1) {
                    requestAnimationFrame(updateCounter);
                }
            }

            // Start animation after a brief delay for layout stabilization
            setTimeout(() => {
                requestAnimationFrame(updateCounter);
            }, 300);
        });

        // Optional: Automatic page transition after completion (e.g., 4-5 seconds)
        /*
        setTimeout(() => {
            window.location.href = "/dashboard";
        }, 5000);
        */
    </script>
