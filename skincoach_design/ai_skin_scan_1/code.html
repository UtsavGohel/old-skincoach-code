<style>
        .material-symbols-outlined {

        }

            background: rgba(255, 255, 255, 0.15);

            border: 1px solid rgba(255, 255, 255, 0.2);

            height: 380px;

            0% { box-shadow: 0 0 0 0px rgba(161, 208, 193, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(161, 208, 193, 0); }
            100% { box-shadow: 0 0 0 0px rgba(161, 208, 193, 0); }
        }

        .pulse-border {
            animation: pulse-glow 2.5s infinite;
        }

        .floating-tip-transition {
            animation: slide-up-fade 4s infinite ease-in-out;
        }

        @keyframes slide-up-fade {
            0%, 100% { opacity: 0; transform: translateY(10px); }
            20%, 80% { opacity: 1; transform: translateY(0); }
        }

        .shutter-active:active {
            transform: scale(0.92);

<!-- Micro-interactions Script -->
<script>
        document.querySelector('.group').addEventListener('click', function() {
            const flash = document.getElementById('shutter-flash');
            flash.classList.remove('opacity-0');
            flash.classList.add('opacity-40');
            
            setTimeout(() => {
                flash.classList.remove('opacity-40');
                flash.classList.add('opacity-0');
            }, 100);

            // Simulation of capturing
            console.log("Skin Scan Captured");
        });

        // Tip rotation simulation
        const tips = [
            "Natural daylight gives the best results.",
            "Remove glasses for better eye area analysis.",
            "Pull back your hair to expose your forehead.",
            "Keep a neutral expression for consistency."
        ];
        let tipIndex = 0;
        const tipContainer = document.querySelector('.floating-tip-transition p');
        
        setInterval(() => {
            tipIndex = (tipIndex + 1) % tips.length;
            tipContainer.parentElement.style.opacity = '0';
            setTimeout(() => {
                tipContainer.textContent = tips[tipIndex];
                tipContainer.parentElement.style.opacity = '1';
            }, 500);
        }, 5000);
    </script>
