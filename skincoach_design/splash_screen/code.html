<style>
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes progress {
            0% { width: 0%; opacity: 0.5; }
            50% { opacity: 1; }
            100% { width: 100%; opacity: 0.5; }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(56, 100, 88, 0.1); }
            50% { box-shadow: 0 0 40px rgba(56, 100, 88, 0.3); }
        }

        .animate-fade-scale {
            animation: fadeInScale 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .animate-float {
            animation: subtleFloat 6s ease-in-out infinite;
        }

        .loading-line {
            animation: progress 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        .material-symbols-outlined {

<script>
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) / 50;
                const moveY = (e.clientY - window.innerHeight / 2) / 50;
                const elements = document.querySelectorAll('.animate-fade-scale');
                elements.forEach((el, index) => {
                    const depth = (index + 1) * 0.2;
                    el.style.transform = `translate(${moveX * depth}px, ${moveY * depth}px)`;
                });
            });

            // Simulate the transition to main dashboard (for UI demo purposes)
