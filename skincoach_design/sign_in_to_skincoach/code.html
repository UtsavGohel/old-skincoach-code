<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<div class="pt-4">
<button class="w-full h-14 bg-primary text-white rounded-full font-bold shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all">
                        Sign In
                    </button>
</div>
</form>
<div class="mt-12 text-center">
<p class="text-body-md text-on-surface-variant">
                    Don't have an account? <br>
<button class="mt-2 text-primary font-bold text-lg hover:underline">Create Account</button>
</p>
</div>
</div>
</div>
<!-- Micro-interaction Scripts -->
<script>
        function toggleBottomSheet(isOpen) {
            const sheet = document.getElementById('bottom-sheet');
            const overlay = document.getElementById('bottom-sheet-overlay');
            
            if (isOpen) {
                sheet.classList.remove('translate-y-full');
                overlay.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                sheet.classList.add('translate-y-full');
                overlay.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        // Close on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') toggleBottomSheet(false);
        });

        // Background subtle parallax effect
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            document.body.style.backgroundPosition = `${x}px ${y}px`;
        });
    </script>
