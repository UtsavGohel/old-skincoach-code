<style>
        body {
            background-color: #FBFAF7; /* Warm Cream Base */
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .organic-bg-blur {
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: -1;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            background-color: #386458; /* Primary Sage */
        }

        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-fill {
            width: 0%;
            transition: width 1.5s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .wheel-picker {
            mask-image: linear-gradient(to bottom, transparent, black 40%, black 60%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 40%, black 60%, transparent);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(167, 196, 188, 0.3);
        }

        .glass-input:focus-within {

<body class="font-body-md text-on-surface selection:bg-primary-fixed">
<!-- Background Ornaments -->

<div class="blob w-[500px] h-[500px] -top-20 -right-20 animate-pulse"></div>
<div class="blob w-[400px] h-[400px] -bottom-40 -left-20" style="background-color: #A7C4BC; animation-delay: 2s;"></div>
</div>
<!-- Layout Wrapper -->

<div class="h-[2px] w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary progress-fill" id="progressBar" style="width: 0%;"></div>
</div>
<p class="text-center font-label-sm text-label-sm text-outline-variant mt-2 tracking-widest uppercase">Step 1 of 2</p>
</div>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col pt-8 pb-32">

<label class="absolute left-6 top-5 text-on-surface-variant transition-all pointer-events-none peer-placeholder-shown:top-5 peer-placeholder-shown:text-body-md peer-focus:top-2 peer-focus:text-label-sm peer-focus:text-primary not-placeholder-shown:top-2 not-placeholder-shown:text-label-sm" for="userName">

<button class="gender-chip px-6 py-3 rounded-full bg-primary text-white font-label-md text-label-md shadow-md" type="button">

<button class="gender-chip px-6 py-3 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant/30 transition-all" type="button">

                    Continue

</button>

<script>
        // Micro-interactions & Animations
        window.addEventListener('DOMContentLoaded', () => {
            // Fill progress bar on load
            setTimeout(() => {
                document.getElementById('progressBar').style.width = '50%';
            }, 300);

            // Gender selection logic
            const chips = document.querySelectorAll('.gender-chip');
            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    chips.forEach(c => {
                        c.classList.remove('bg-primary', 'text-white', 'shadow-md');
                        c.classList.add('border', 'border-outline-variant', 'text-on-surface-variant');
                    });
                    chip.classList.add('bg-primary', 'text-white', 'shadow-md');
                    chip.classList.remove('border', 'border-outline-variant', 'text-on-surface-variant');
                });
            });

            // Handle Age Scroll Snap micro-interaction (Visual only for prototype)
            const ageScroll = document.getElementById('ageScroll');
            ageScroll.addEventListener('scroll', () => {
                // In a real app, we'd calculate center element and update styling/state here
            });
        });
    </script>
